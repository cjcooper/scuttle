[package]
name = "scuttle"
version = "0.1.7"
description = "Menu bar controller for Colima, Docker and similar container runtimes"
authors = ["it-problems"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "scuttle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
async-trait = "0.1"
thiserror = "2"
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-opener = "2"
serde_yaml = "0.9"
tauri-plugin-single-instance = "2"
auto-launch = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# Builds Scuttle natively on each desktop OS. Each runner produces
# the bundles for its own system (see src-tauri/tauri.<os>.conf.json):
#   macOS   → .app and .dmg
#   Linux   → .deb, .rpm and .AppImage
#   Windows → NSIS .exe installer and .msi
# Bundles are unsigned and kept as workflow artifacts for 14 days. For a
# signed, notarized macOS release run tools/build-signed.sh locally.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install --locked tauri-cli@2.12.1

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build bundles
        run: cargo tauri build
        env:
          # AppImage tooling runs without FUSE on CI runners.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: scuttle-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
